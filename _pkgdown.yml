url: https://mjorden.github.io/powerline-veg-risk/

template:
  bootstrap: 5
  bslib:
    primary: "#1f3b73"

navbar:
  structure:
    left: [intro, articles, reference]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
        - text: How the screen works
          href: articles/methods.html
        - text: "Case study: Sunshine Canyon, Colorado"
          href: articles/sunshine-canyon.html
        - text: "Case study: West Nashville, Tennessee"
          href: articles/nashville.html
        - text: Limits and roadmap
          href: articles/limits-and-roadmap.html

articles:
  - title: Method
    navbar: ~
    contents:
      - articles/methods
      - articles/limits-and-roadmap
  - title: Case studies
    navbar: ~
    contents:
      - articles/sunshine-canyon
      - articles/nashville

reference:
  - title: Data acquisition
    contents:
      - tnm_lidar_tiles
      - download_tiles
      - osm_power_lines
      - osm_power_structures
      - osm_buildings
  - title: Corridor point cloud
    contents:
      - read_corridor
      - line_corridor
      - las_m_per_unit
  - title: Classification
    contents:
      - point_features
      - rule_proxy_features
      - weak_labels
      - assign_blocks
      - train_point_classifier
      - cv_point_classifier
      - classify_probs
      - evaluate_vendor_classes
      - predict_points
  - title: Conductor model and risk
    contents:
      - segment_lines
      - line_vertex_points
      - corridor_rasters
      - conductor_profile
      - assess_risk
  - title: Canopy greenness and moisture (Landsat)
    contents:
      - landsat_scenes
      - landsat_composite
      - canopy_dryness
  - title: Fire-weather wind
    contents:
      - wind_history
      - fire_wind_hours
      - wind_fall_exposure
      - nws_forecast
      - nws_alerts
      - forecast_watchlist
  - title: Figures
    contents:
      - starts_with("plot_")
  - title: internal
    contents:
      - vegrisk-package
